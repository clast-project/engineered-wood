name: Interop (nightly)

# The full external-validation matrix, including the Spark tier that the per-commit
# build cannot afford: every Spark command starts a JVM, and a cold run also pays Ivy
# resolution of the Delta jars.
#
# This is where the conformance guarantees actually live. Round-trip tests prove EW
# agrees with itself; only these prove EW agrees with the Delta reference
# implementation — and the bugs they have caught (partition-path escaping that made
# Spark fail a whole table, a V2 checkpoint that dropped every tombstone) are all of
# the kind that leave a round-trip test perfectly green.
on:
  schedule:
    # 06:00 UTC daily. Nothing depends on the hour; it is simply off-peak.
    - cron: '0 6 * * *'
  workflow_dispatch:
  # This job and the drivers it runs are validated on any PR that CHANGES them.
  # Without it the first proof that an edit works is a nightly failing at 06:00 with
  # nobody watching — and `workflow_dispatch` cannot help, since it only appears once
  # a workflow is on the default branch, i.e. after the change has already landed.
  # Narrow enough that ordinary PRs never pay for it.
  pull_request:
    paths:
      - '.github/workflows/interop-nightly.yml'
      - 'test/EngineeredWood.DeltaLake.Table.Tests/Interop/**'

jobs:
  interop:
    # Linux, not Windows, purely to avoid winutils.exe: Hadoop's Windows shim needs
    # winutils.exe + hadoop.dll on PATH or it throws UnsatisfiedLinkError on the first
    # directory listing. `Spark.Preflight` gates that requirement on Windows only, so
    # on Linux a JDK is the whole prerequisite.
    #
    # The cost is that net472 cannot be built here (no .NET Framework reference
    # assemblies), so this runs net10.0 only. That is not a real gap: the interop
    # drivers are subprocesses and the assertions are framework-independent — net472
    # coverage of the same tests comes from the per-commit build on Windows.
    #
    # Two Spark lanes, because the two Spark lines write different VARIANT layouts and EW
    # must keep both working (see Spark.ValidatedAgainstVersion):
    #   spark-4.1  primary. VARIANT is GA and shredding works, so every interop case runs;
    #              the healthy result is 0 skipped.
    #   spark-4.0  Spark 4.0's UNANNOTATED variant layout and the preview shredding name.
    #              The cases that need 4.1 (or delta-spark 4.3) skip honestly; the healthy result is 10 skipped.
    # The delta-rs and DuckDB tiers run in both lanes. They are cheap, and keeping the lanes
    # identical except for the two Spark pins means a difference between them is Spark's.
    name: interop (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: spark-4.1
            pyspark: '4.1.2'
            delta-spark: '4.3.1'
          - lane: spark-4.0
            pyspark: '4.0.4'
            delta-spark: '4.0.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Spark 4.0 and 4.1 need Java 17+.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # See ci.yml for why this was pinned at 3.11 until 2026-08: SPARK-53759 broke
      # the PySpark worker on WINDOWS under Python 3.12+. This job runs on Linux,
      # where Spark forks workers via pyspark.daemon rather than spawn-and-connect-
      # back, so the bug never reached it — but a nightly that only passes on a
      # Python the dev boxes cannot use is not validating what anyone runs.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned deliberately — see Spark.ValidatedAgainstVersion / DeltaRs /
      # DuckDb.ValidatedAgainstVersion. These packages are the ORACLES the assertions
      # were established against, so a behaviour change in one of them must arrive as
      # a considered bump here rather than as a nightly that turned red on its own.
      #
      # delta-spark must be built for the pyspark it runs on. The two pairings are the
      # ones measured against the full tier (doc/running-tests.md).
      #
      # The pyspark versions are the first with the SPARK-53759 fix (see the Setup
      # Python step): 4.0.4 rather than 4.0.1, 4.1.2 rather than 4.1.1. The bug is
      # Windows-only, so the older builds would still pass HERE, but the dev-box
      # instructions have to name versions that work on Windows, and there is no reason
      # for the oracle this job pins and the one a contributor installs to differ.
      #
      # delta-spark goes in with --no-deps. Every release through 4.3.1 declares
      # pyspark<=4.1.1, so pip refuses 4.1.2 + 4.3.1 with ResolutionImpossible. The
      # pairing works (4.3.1 is the first delta-spark whose jars match Spark 4.1.2;
      # 4.1.0 hits a NoSuchMethodError on checkpointed tables). Its one other
      # dependency is installed explicitly, within its declared range. pyspark 4.2.0 +
      # delta-spark 4.4.1 needs no --no-deps and passes the full tier locally
      # (doc/running-tests.md), but moving this matrix to it is a separate decision.
      #
      # pyarrow is listed EXPLICITLY: deltalake 1.6.2 made it an optional extra, so
      # without it every delta-rs read raises "Pyarrow is required" — invisible on a
      # dev box, which has pyarrow for the ORC cross-validation.
      - name: Install interop oracles (Spark, delta-rs, DuckDB)
        run: |
          python -m pip install --disable-pip-version-check \
            pyspark==${{ matrix.pyspark }} importlib_metadata==8.7.1 \
            deltalake==1.6.2 pyarrow==24.0.0 duckdb==2.0.0
          python -m pip install --disable-pip-version-check --no-deps \
            delta-spark==${{ matrix.delta-spark }}

      # Warms the Ivy cache so the first test does not pay jar resolution inside its
      # own timeout, and fails here — with a readable error — rather than deep inside
      # a test if the Delta jars cannot be resolved at all.
      - name: Warm the Delta jar cache
        run: |
          python - <<'PY'
          from pyspark.sql import SparkSession
          from delta import configure_spark_with_delta_pip
          builder = (SparkSession.builder.master("local[1]").appName("warm")
                     .config("spark.sql.extensions",
                             "io.delta.sql.DeltaSparkSessionExtension")
                     .config("spark.sql.catalog.spark_catalog",
                             "org.apache.spark.sql.delta.catalog.DeltaCatalog"))
          configure_spark_with_delta_pip(builder).getOrCreate().stop()
          PY

      - name: Build
        run: dotnet build test/EngineeredWood.DeltaLake.Table.Tests/EngineeredWood.DeltaLake.Table.Tests.csproj -f net10.0 --configuration Release

      # EW_REQUIRE_* makes an unreachable toolchain a FAILURE rather than a skip.
      # The tests self-report honestly now ([SkippableFact] + X.Require()), but an
      # honest skip is still a green: without these the nightly could skip every
      # tier and pass having validated nothing — the exact failure mode this job
      # exists to prevent. All three are set because this job, unlike ci.yml,
      # depends on all three tiers.
      - name: Interop tests
        env:
          EW_REQUIRE_SPARK_INTEROP: '1'
          EW_REQUIRE_DELTA_INTEROP: '1'
          EW_REQUIRE_DUCKDB_INTEROP: '1'
        run: |
          dotnet test test/EngineeredWood.DeltaLake.Table.Tests/EngineeredWood.DeltaLake.Table.Tests.csproj \
            -f net10.0 --no-build --configuration Release \
            --filter "FullyQualifiedName~Interop" \
            --logger "trx;LogFileName=interop-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-results-${{ matrix.lane }}
          path: '**/interop-results.trx'
