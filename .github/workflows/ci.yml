name: CI

# NOTE: do NOT add `paths-ignore` here to skip documentation changes.
# `build` is a REQUIRED status check on main. A workflow skipped by path
# filtering never reports its checks — they stay Pending forever and the PR
# can never merge. The job below therefore always runs and always reports;
# it decides internally whether there is anything worth compiling.
# NOTE: `pull_request` is deliberately NOT filtered by base branch. A stacked PR
# (one targeting another PR's branch rather than main) would otherwise get no CI
# at all — and the failure is silent in the same way path filtering is: the
# required `build` check never reports, so the PR sits Blocked until someone
# retargets it. Measured on PR #99, which accumulated a whole feature unverified.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # windows-latest is required because several test projects target net472,
    # which exercises the netstandard2.0 build of the libraries.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # parquet-testing is a git submodule that the Parquet compatibility
          # tests read their fixtures from.
          submodules: recursive
          # Full history so the change detection below can diff against the
          # base commit.
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: changes
        shell: bash
        run: |
          # Fails safe: anything this cannot classify with confidence runs the
          # full build. Skipping CI by accident is far worse than running it.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base commit unavailable — running the full build."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "Changed files:"
          echo "$changed"

          # Documentation is doc/** and top-level *.md. Everything else —
          # including .github/** — counts as code. An empty diff also counts as
          # code, so the full build runs.
          if printf '%s\n' "$changed" | grep -qvE '^(doc/|[^/]*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change — skipping restore, build, test and pack."
          fi

      # Source files are UTF-8 without a BOM. This step is the only guarantee of that:
      # .editorconfig is advisory (an editor may ignore it, a script writing a file has
      # no editor at all), and the `filter=nobom` rule in .gitattributes needs a one-time
      # local `git config` that a fresh clone has not run — an undefined filter driver is
      # silently ignored, so the BOM would sail through unnoticed.
      #
      # Deliberately NOT gated on steps.changes.outputs.code: it needs no toolchain, takes
      # about a second across ~800 files, and gating it would only create a path by which
      # a change classified as documentation could carry a BOM in unchecked.
      #
      # Verified to fail, not just to pass: seeding a BOM into GrowableBuffer.cs makes this
      # exit 1 and name the file. A check only ever observed passing is indistinguishable
      # from one that inspects nothing — see the interop-tier note on the Test step below.
      - name: Check for UTF-8 BOMs
        shell: bash
        run: |
          found="$(git ls-files -- '*.cs' | perl -ne '
              chomp;
              open my $h, "<", $_ or next;
              binmode $h;
              read $h, my $head, 3;
              print "$_\n" if defined $head && $head eq "\xef\xbb\xbf";
          ')"

          if [ -n "$found" ]; then
            echo "::error::These .cs files start with a UTF-8 byte order mark:"
            printf '%s\n' "$found"
            echo "Strip it, or enable the filter documented in .gitattributes."
            exit 1
          fi

          echo "No UTF-8 BOMs in tracked .cs files."

      - name: Setup .NET
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # 3.11 until 2026-08: PySpark could not run on Windows under Python 3.12+
      # (SPARK-53759, a missing flush in the simple-worker path — the worker died
      # mid-handshake). Fixed upstream in pyspark 4.0.3 / 4.1.2 / 3.5.9. This job
      # never ran the Spark tier, but it was held at 3.11 to match the nightly and
      # the dev-box instructions rather than diverge from them.
      #
      # 3.11.9 (Apr 2024) is also the last 3.11 with a Windows installer; the branch
      # is security-only and EOL Oct 2027, so staying there had a shelf life.
      - name: Setup Python
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The two interop tiers cheap enough to gate every commit on. Both are pure
      # Python — no JDK, no JVM — and add seconds. The Spark tier is the expensive
      # one and runs in interop-nightly.yml instead.
      #
      # Versions are pinned because these tiers are ORACLES: an upgrade that changes
      # behaviour must show up as a deliberate bump in this file, not as a build that
      # started failing overnight for reasons nobody chose.
      #
      # pyarrow is listed EXPLICITLY. deltalake 1.6.2 no longer depends on it — it is
      # an optional extra (`deltalake[pyarrow]`) — so `deltalake` alone installs a
      # package whose read paths raise "Pyarrow is required" the moment a driver
      # command touches data. That went unnoticed locally because pyarrow is already
      # present on a dev box for the ORC cross-validation, which is exactly the kind
      # of undeclared dependency this job exists to surface. Declaring it also turns
      # ON the ORC PyArrow cross-validation tests, which had been soft-skipping here.
      #
      # tzdata likewise: CPython on Windows ships NO time-zone database, so
      # `zoneinfo.ZoneInfo("UTC")` — which delta_rs_driver's read_epoch_micros needs —
      # raises ZoneInfoNotFoundError on a clean runner. Linux has a system tz database
      # and does not, which is why the nightly did not hit this.
      #
      # tzdata is pinned like the rest despite being a data package whose drift cannot
      # affect anything here (only UTC is looked up, and UTC does not move). A rule with
      # one unexplained exception stops being a rule; if a future release ever needs to
      # float, that should be a stated decision rather than the absence of a version.
      #
      # fastavro is the Avro counterpart of the pyarrow story above, and was missed when
      # pyarrow was added for ORC. Without it the seven "EW writes -> fastavro reads"
      # tests report Skipped — honestly, via SkippableFact, unlike the Delta interop
      # tiers — but nobody reads the Skipped column. Measured: 301 passed / 0 skipped
      # with fastavro, 294 / 7 without. That is the entire Avro WRITE direction going
      # unvalidated by an external implementation; direction 1 stays covered either way,
      # because its .avro fixtures are committed.
      #
      # lz4 must come WITH fastavro, never after it. fastavro's LZ4 codec is a separate
      # package, so installing fastavro alone turns
      # AvroPhase6Tests.WriteThenReadWithFastavro_Lz4 from a clean skip into a hard
      # failure: "ValueError: lz4 codec is supported but you need to install one of the
      # following libraries: ('lz4',)".
      # datafusion is here for its parquet reader, not for SQL: it reads through the
      # arrow-rs `parquet` crate, which is the decoder behind polars, delta-rs and every
      # Rust consumer, and which nothing else in this repository exercises. ParquetSharp
      # covers parquet-cpp and pyarrow descends from it, so without datafusion the whole
      # test suite validates against a single lineage of reference implementation.
      #
      # It shares the DuckDB pin's reasoning: an upgrade that changes what these readers
      # accept must arrive as a deliberate bump here.
      - name: Install interop oracles (delta-rs, DuckDB, DataFusion, fastavro)
        if: steps.changes.outputs.code == 'true'
        run: >
          python -m pip install --disable-pip-version-check
          deltalake==1.6.2 pyarrow==24.0.0 duckdb==1.5.5 tzdata==2026.3
          datafusion==54.0.0
          fastavro==1.12.2 lz4==4.4.5

      - name: Restore
        if: steps.changes.outputs.code == 'true'
        run: dotnet restore engineered-wood.slnx

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: dotnet build engineered-wood.slnx --no-restore --configuration Release

      - name: Test
        if: steps.changes.outputs.code == 'true'
        # EW_REQUIRE_* turns an unavailable tier into a hard FAILURE instead of a skip,
        # which is the whole point of setting them here.
        #
        # An unreachable tier does report Skipped now — the interop tests are
        # [SkippableFact] and open with `X.Require();`, matching the ORC and Avro
        # cross-validation suites. But a skip only makes the run honest, it does not
        # make it a gate: a job can skip a whole tier and still go green, taking that
        # tier's conformance guarantees with it. These variables are what turn "the
        # toolchain was missing" into a red build.
        #
        # Historically the gate was `if (!X.EnsureAvailable()) return;`, which returns
        # normally, so xUnit counted an unreachable test PASSED — with no JDK present
        # the 54 Spark interop tests reported "Passed: 54, Skipped: 0" in 94ms, which
        # no CI summary could distinguish from real coverage. That is fixed, but the
        # variables still earn their place for the reason above.
        #
        # The Spark tier stays unset here and is exercised by interop-nightly.yml.
        env:
          EW_REQUIRE_DELTA_INTEROP: '1'
          EW_REQUIRE_DUCKDB_INTEROP: '1'
          EW_REQUIRE_PARQUET_READERS_INTEROP: '1'
        run: dotnet test engineered-wood.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        if: steps.changes.outputs.code == 'true'
        # test/ and benchmark projects opt out of packing (test/Directory.Build.props),
        # so this produces only the 15 src/ libraries.
        run: dotnet pack engineered-wood.slnx --no-build --configuration Release --output artifacts

      - name: Upload test results
        if: always() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

      - name: Upload packages
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # The cloud-backend tests, against real emulators. This is step 2 of issue #79.
  #
  # WHY A SECOND JOB, ON LINUX. The `build` job above must be windows-latest because several
  # test projects target net472. None of the three emulators here is usable as an oracle on
  # Windows: MinIO stores each object as a file and so rejects `region=a?d` with NTFS's rules
  # rather than S3's, which fails two of the path-conformance cases for a reason that has
  # nothing to do with the code under test. Linux is where these backends can be measured
  # honestly, and nothing in EngineeredWood.{Azure,Gcs,Aws} is platform-specific.
  #
  # WHY PROCESSES AND NOT `services:`. The issue proposed service containers. Two of the three
  # emulators do not fit that shape: storage-testbench is a pip package with no published
  # image, and MinIO's image needs a `server /data` command, which `services:` cannot supply.
  # Starting all three as background processes is uniform, needs no image, and keeps the health
  # checks explicit rather than hidden behind `--health-cmd`.
  #
  # THIS JOB IS NOT A REQUIRED CHECK. Making it one is a deliberate follow-up: it should earn
  # that by being green and non-flaky across a few runs first. Until then a failure here is
  # visible on the PR but does not block merging.
  cloud-io:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # All three are PINNED, for the same reason the interop oracles above are: these decide
      # whether the backends conform, so a behaviour change must arrive as a deliberate bump in
      # this file rather than as a build that started failing overnight.
      #
      # storage-testbench is pinned by TAG, not version: the package reports 0.45.0 at tag
      # v0.63.0 because its setup.py lags its tags, so the version string is not a usable pin.
      #
      # storage-testbench rather than fake-gcs-server, and the choice is the point of this job.
      # fake-gcs-server ignores `ifGenerationMatch=0` — measured at the wire level, two
      # create-if-absent uploads both return 200 and the second overwrites — so it cannot answer
      # for ITableFileSystem.TryWriteAllBytesAsync, the primitive Delta and Iceberg commits are
      # built on. It would give a false green or a permanent false red on exactly that.
      # storage-testbench returns 412 and preserves the winner. Google maintains it to validate
      # its own client libraries, which is what makes it credible: it is the fake the vendor's
      # own conformance tests run against.
      - name: Install storage-testbench (GCS emulator)
        run: >
          python -m pip install --disable-pip-version-check
          "git+https://github.com/googleapis/storage-testbench.git@v0.63.0"

      # Installed globally with no sudo and no npm prefix juggling, which reads like it should fail
      # and does not: MEASURED on this runner image, `npm install -g` writes 306 packages without a
      # permission error, and the curl below writes /usr/local/bin directly. Both are recorded here
      # because both look wrong to a reviewer. If a future image changes either, the failure is LOUD
      # and immediate -- the install step exits non-zero under `bash -e` and the job goes red -- so
      # defending against it in advance would only add noise to a step that cannot fail quietly.
      - name: Install Azurite (Azure Blob emulator)
        run: npm install -g azurite@3.36.0

      # MinIO rather than gofakes3, which was used while this ran only on a dev box: gofakes3
      # stores AWSSDK v4's `aws-chunked` request framing AS the object body, so a multipart
      # upload reads back longer than it went in. Working around that meant disabling checksum
      # calculation and validation on the client, which switched off the very thing being
      # tested. MinIO handles the framing, so the tests now exercise checksums for real.
      - name: Install MinIO (S3 emulator)
        run: |
          curl -fsSL -o /usr/local/bin/minio \
            https://dl.min.io/server/minio/release/linux-amd64/archive/minio.RELEASE.2025-09-07T16-13-09Z
          chmod +x /usr/local/bin/minio

      - name: Start emulators
        run: |
          mkdir -p /tmp/azurite /tmp/minio-data
          azurite --silent --location /tmp/azurite \
            --blobPort 10000 --queuePort 10001 --tablePort 10002 &
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            minio server /tmp/minio-data --address :9000 --console-address :9001 &
          storage-testbench --port 4443 &

      # Explicitly, and with a bounded wait: a test suite that starts before its emulator is
      # listening does not fail loudly, it SKIPS — the probe in CloudEmulator catches the
      # connection error and the run goes green having tested nothing. That is the exact failure
      # #79 exists to remove, so the readiness check is a gate and not a convenience.
      - name: Wait for emulators
        run: |
          for hostport in 127.0.0.1:10000 127.0.0.1:9000 127.0.0.1:4443; do
            host="${hostport%:*}"; port="${hostport#*:}"
            for _ in $(seq 1 60); do
              if timeout 1 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then
                echo "$hostport is listening"
                break 1
              fi
              sleep 1
            done
            if ! timeout 1 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then
              echo "::error::$hostport never came up; the suite would have skipped silently."
              exit 1
            fi
          done

      - name: Restore
        run: dotnet restore test/EngineeredWood.Parquet.Tests/EngineeredWood.Parquet.Tests.csproj

      - name: Build
        run: >
          dotnet build test/EngineeredWood.Parquet.Tests/EngineeredWood.Parquet.Tests.csproj
          --no-restore --configuration Release --framework net10.0

      # EW_REQUIRE_CLOUD_EMULATORS=1 is what makes this job mean anything. Without it every one
      # of these tests skips when an emulator is missing and the job still reports success —
      # indistinguishable from having tested the backends. With it, an unreachable emulator is a
      # failure naming the emulator and the diagnosis its probe produced.
      - name: Test cloud backends
        env:
          EW_REQUIRE_CLOUD_EMULATORS: '1'
        run: >
          dotnet test test/EngineeredWood.Parquet.Tests/EngineeredWood.Parquet.Tests.csproj
          --no-build --configuration Release --framework net10.0
          --filter "FullyQualifiedName~EngineeredWood.Tests.IO"
          --logger "trx;LogFileName=cloud-io-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-io-test-results
          path: '**/cloud-io-results.trx'
