name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # windows-latest is needed for the net472 test pass against the
    # netstandard2.0 build of the libraries.
    runs-on: windows-latest

    permissions:
      contents: write   # required for creating GitHub Releases
      id-token: write   # OIDC token for nuget.org trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          # Tag v0.1.0 -> version 0.1.0. This overrides the default <Version>
          # in src/Directory.Build.props, so the tag is the single source of
          # truth for a release's version — all 15 packages share it.
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing version $version"

      - name: Find the previous release
        id: baseline
        shell: pwsh
        run: |
          # The newest v* tag reachable from this commit, other than the one being released, whose
          # packages are on nuget.org. A tag whose release failed never published, so it is skipped.
          # Those packages are the baseline the Pack step checks API compatibility against.
          $published = (Invoke-RestMethod 'https://api.nuget.org/v3-flatcontainer/engineeredwood.core/index.json').versions
          # Collect git's output before filtering: stopping the pipeline early (Select-Object -First)
          # kills git, whose non-zero exit code would then fail the step.
          $tags = @(git tag --merged HEAD --list 'v*' --sort=-v:refname)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prevVersion = $tags |
            Where-Object { $_ -ne $env:GITHUB_REF_NAME } |
            ForEach-Object { $_ -replace '^v', '' } |
            Where-Object { $published -contains $_ } |
            Select-Object -First 1
          if (-not $prevVersion) {
            Write-Error "No earlier published release found to check API compatibility against."
            exit 1
          }
          "version=$prevVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Checking API compatibility against $prevVersion"

      - name: Restore
        # ApiBaselineVersion here makes restore download the baseline packages that package
        # validation compares against in the Pack step, which runs with --no-build (so no restore).
        run: dotnet restore engineered-wood.slnx -p:ApiBaselineVersion=${{ steps.baseline.outputs.version }}

      - name: Build
        run: dotnet build engineered-wood.slnx --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test engineered-wood.slnx --no-build --configuration Release

      - name: Pack
        # Produces the 15 src/ libraries at the tag version (test/benchmark
        # projects opt out of packing via test/Directory.Build.props).
        # -p:ApiBaselineVersion turns on package validation against the previous release:
        # a breaking change not listed in a CompatibilitySuppressions.xml fails the release
        # here, before anything is pushed. See doc/releasing.md.
        run: dotnet pack engineered-wood.slnx --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:ApiBaselineVersion=${{ steps.baseline.outputs.version }} --output artifacts

      - name: NuGet login (trusted publishing)
        # Exchanges the workflow's OIDC token for a short-lived (~1 hour) nuget.org
        # API key, per the "engineered-wood" trusted publishing policy on nuget.org
        # (repo clast-project/engineered-wood, workflow release.yml). It runs after
        # Test so the key cannot expire before the push.
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: curt_hagenlocher

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if (-not $env:NUGET_API_KEY) {
            Write-Error "NuGet login produced no API key."
            exit 1
          }
          # `dotnet nuget push` does not reliably expand a wildcard path, so
          # enumerate the packages and push each explicitly. The matching
          # .snupkg symbol package next to each .nupkg is pushed automatically.
          $pkgs = Get-ChildItem -Path artifacts -Filter *.nupkg
          if (-not $pkgs) {
            Write-Error "No .nupkg files found in artifacts/."
            exit 1
          }
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name)"
            dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem artifacts/*.nupkg, artifacts/*.snupkg | ForEach-Object { $_.FullName })
          gh release create "${{ github.ref_name }}" @assets --generate-notes
