[package]
name = "vortex-fixtures"
version = "0.1.0"
edition = "2021"
publish = false

# Generates .vortex test fixtures for EngineeredWood.Vortex.Tests.
# Run from this directory:  cargo run --release -- ../TestData
# The binary writes one .vortex file per fixture into the given output dir.

[[bin]]
name = "vortex-fixtures"
path = "src/main.rs"

[[bin]]
name = "vortex-validator"
path = "src/validator.rs"

[dependencies]
vortex-array = "0.86.1"
vortex-buffer = "0.86.1"
vortex-file = "0.86.1"
vortex-io = { version = "0.86.1", features = ["tokio"] }
vortex-layout = "0.86.1"
vortex-session = "0.86.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = "1"
vortex-utils = "0.86.1"
vortex-fastlanes = "0.86.1"
vortex-onpair = "0.86.1"
vortex-pco = "0.86.1"
vortex-sequence = "0.86.1"
vortex-zigzag = "0.86.1"
vortex-zstd = "0.86.1"
futures = "0.3"
vortex = { version = "0.86.1", default-features = false, features = ["files", "tokio", "zstd"] }
